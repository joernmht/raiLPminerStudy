# Paper 0 rerun (2026): the complete design. Change nothing here after the first
# production run without a new study_id; every run record stores this file's SHA-256.

study_id = "paper0-2026"
base_url = "https://llm.scads.ai/v1"
api_key_env = "SCADS_API_KEY"
seed = 20261004

# ScaDS.AI is a shared academic service: one request in flight, a pause between
# requests, a daily budget (persisted in state/, shared by all processes).
[pacing]
min_interval_s = 3.0
max_requests_per_day = 1500
request_timeout_s = 900.0
max_tries = 6
max_tool_rounds = 4
max_subcalls = 10
ps_count_min = 2
ps_count_max = 5

# Five open-weight generators, one per family (probed 2026-10-04: system prompt,
# temperature, seed and a forced named tool call are honoured). Roles mirror the 2025
# line-up (Gemini 2.5 Pro / Flash, o4-mini, DeepSeek-V3). Every model reasons as little
# as it allows (docs/adr/0003): thinking off where the switch works, else the lowest
# effort; GLM-5.3 was replaced after it spent 16,000 tokens on reasoning per call.
[models.glmflash]
served_id = "zai-org/GLM-5.3-Flash"
family = "GLM (Z.ai)"
licence = "MIT"
role = "GLM family, replaces GLM-5.3 (2025 role: Gemini 2.5 Pro)"
max_tokens = 16000
extra = { reasoning_effort = "low" }

[models.deepseek]
served_id = "deepseek-ai/DeepSeek-V4.1-Flash"
family = "DeepSeek"
licence = "MIT"
role = "fast model, continuity with DeepSeek-V3 (2025)"
max_tokens = 16000
extra = { chat_template_kwargs = { thinking = false } }

# Amended 2026-10-05, after the glmflash and deepseek blocks and before any gptoss or qwen
# run (docs/adr/0004): these two models are served by DeepInfra via OpenRouter so that the
# study finishes within the ScaDS budget. Their cells, seeds and run order are unchanged;
# the reasoning settings are the same, in OpenRouter's notation.
[models.gptoss]
served_id = "openai/gpt-oss-120b"
family = "gpt-oss (OpenAI)"
licence = "Apache-2.0"
role = "compact model from the vendor of o4-mini (2025)"
max_tokens = 16000
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra = { reasoning = { effort = "low" }, provider = { order = ["deepinfra/bf16"], allow_fallbacks = false }, usage = { include = true } }

[models.qwen]
served_id = "qwen/qwen3.8-27b"
family = "Qwen (Alibaba)"
licence = "Apache-2.0"
role = "small dense model (2025 role: Gemini 2.5 Flash)"
max_tokens = 16000
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra = { reasoning = { enabled = false }, provider = { order = ["deepinfra/bf16"], allow_fallbacks = false }, usage = { include = true } }

[models.minimax]
served_id = "MiniMaxAI/MiniMax-M3"
family = "MiniMax"
licence = "MiniMax model licence (other)"
role = "fifth family"
max_tokens = 16000
extra = { reasoning_effort = "low" }

# The parsing model (LP2Graph v2), chosen on the 54 instrument cases (instrument/report.json)
# and the input papers' own formulations (references/report.json), 2026-10-04. Gemma-4 with
# the form as a JSON template: 54/54 cases with every verdict and count right, 10/10 reference
# replies parsed. With the JSON schema in the prompt also 54/54, but only 6/10 references (the
# long ones made it return the schema itself); server-side schema decoding looped (Gemma 2 of
# 5); Llama-3.3 prompt 0.98 accepted but linearity 0.58. Neither family generates.
[grapher]
served_id = "google/gemma-4-26B-A4B-it"
mode = "template"
temperature = 0.0
seed = 7
max_tokens = 8000

# Input papers: open access under a Creative Commons licence, not MDPI, chosen by the rule in
# docs/adr/0002; attribution in inputs/README.md. `run` refuses while an input is missing.
[papers.P1]
# Anchor of experiment 1. MILP confirmed 2026-10-04: model (13), Appendix D with Section 4.
doi = "10.1287/trsc.2025.0137"
title = "Integrated optimization of train rescheduling and speed management during partial blockages: a decomposition approach"
licence = "CC BY (accepted manuscript)"
input = "inputs/P1.md"

[papers.P2]
doi = "10.1080/23249935.2025.2592225"
title = "Conflict detection and resolution for distance-to-go railway signalling"
licence = "CC BY 4.0"
input = "inputs/P2.md"

[papers.P3]
doi = "10.1016/j.trb.2025.103189"
title = "An exact and heuristic framework for rolling stock rescheduling with railway infrastructure availability constraints"
licence = "CC BY 4.0"
input = "inputs/P3.md"

[papers.P4]
doi = "10.1016/j.trc.2026.105841"
title = "Learning-based model predictive control for passenger-oriented train rescheduling with flexible train composition"
licence = "CC BY 4.0"
input = "inputs/P4.md"

[papers.P5]
doi = "10.1016/j.jrtpm.2024.100496"
title = "Efficient real-time rail traffic optimization: decomposition of rerouting, reordering, and rescheduling problems"
licence = "CC BY-NC 4.0"
input = "inputs/P5.md"

# Experiment 1: the full factorial on the anchor paper (2025: 4 x 4 x 3, >= 14 replicates).
[[experiments]]
name = "exp1"
papers = ["P1"]
models = ["glmflash", "deepseek", "gptoss", "qwen", "minimax"]
workflows = ["ZS", "CFC", "OE", "PS"]
temperatures = [0.2, 0.6, 1.0]
replicates = 15

# Experiment 2: the other four papers, Zero-Shot at temperature 0.6, every model.
# Pre-registered here (2025 picked its setting after seeing experiment 1). The anchor
# paper's baseline for this comparison is exp1's ZS / 0.6 cell of the same model.
[[experiments]]
name = "exp2"
papers = ["P2", "P3", "P4", "P5"]
models = ["glmflash", "deepseek", "gptoss", "qwen", "minimax"]
workflows = ["ZS"]
temperatures = [0.6]
replicates = 15
