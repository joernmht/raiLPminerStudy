# Paper 0 rerun (2026): the complete design. Change nothing here after the first
# production run without a new study_id; every run record stores this file's SHA-256.

study_id = "paper0-2026"
base_url = "https://llm.scads.ai/v1"
api_key_env = "SCADS_API_KEY"
seed = 20261004

# ScaDS.AI is a shared academic service: one request in flight, a pause between
# requests, a daily budget (persisted in state/, shared by all processes).
[pacing]
min_interval_s = 3.0
max_requests_per_day = 1500
request_timeout_s = 900.0
max_tries = 6
max_tool_rounds = 4
max_subcalls = 10
ps_count_min = 2
ps_count_max = 5

# Five open-weight generators, one per family, all served by ScaDS (probed 2026-10-04:
# system prompt, temperature, seed and a forced named tool call are honoured).
# Roles mirror the 2025 line-up (Gemini 2.5 Pro / Flash, o4-mini, DeepSeek-V3).
[models.glm]
served_id = "zai-org/GLM-5.3"
family = "GLM (Z.ai)"
licence = "GLM-5.3 model licence (other)"
role = "strongest open-weight reasoning model (2025 role: Gemini 2.5 Pro)"
max_tokens = 16000

[models.deepseek]
served_id = "deepseek-ai/DeepSeek-V4.1-Flash"
family = "DeepSeek"
licence = "MIT"
role = "fast reasoning model, continuity with DeepSeek-V3 (2025)"
max_tokens = 16000

[models.gptoss]
served_id = "openai/gpt-oss-120b"
family = "gpt-oss (OpenAI)"
licence = "Apache-2.0"
role = "compact reasoning model (2025 role: o4-mini)"
max_tokens = 16000

[models.qwen]
served_id = "Qwen/Qwen3.8-27B"
family = "Qwen (Alibaba)"
licence = "Apache-2.0"
role = "small dense reasoning model (2025 role: Gemini 2.5 Flash)"
max_tokens = 16000

[models.minimax]
served_id = "MiniMaxAI/MiniMax-M3"
family = "MiniMax"
licence = "MiniMax model licence (other)"
role = "fifth family"
max_tokens = 16000

# The parsing model (LP2Graph v2), chosen on the 48 validation cases (instrument/report.json,
# 2026-10-04): Gemma-4 with the schema in the prompt parsed 48/48 with every acceptance verdict
# right (linearity 0.98, counts 0.99); Llama-3.3 prompt 0.94, Llama-3.3 schema 0.81; Gemma
# with server-side schema decoding looped on 2 of 5. Neither family generates.
[grapher]
served_id = "google/gemma-4-26B-A4B-it"
mode = "prompt"
temperature = 0.0
seed = 7
max_tokens = 8000

# Input papers: open access under CC BY, chosen by the rule in docs/adr/0002.
# Placeholders until the selection is confirmed; `run` refuses while an input is missing.
[papers.P1]
doi = "TBD"
title = "TBD"
licence = "TBD"
input = "inputs/P1.md"

[papers.P2]
doi = "TBD"
