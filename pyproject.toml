[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railpminer-study"
version = "0.1.0"
description = "The 2026 rerun of the raiLPminer experiment (Paper 0): LLM-generated railway-rescheduling MILPs, every request on the record, structure measured by a validated parser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jörn Maurischat", email = "joern.maurischat@tu-dresden.de" }]
keywords = ["MILP", "LLM", "railway", "rescheduling", "optimization", "reproducibility"]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.optional-dependencies]
analysis = ["pandas", "statsmodels"]
dev = ["pytest>=8.0", "ruff>=0.15.12,<0.16"]

[project.scripts]
genstudy = "genstudy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["genstudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
# Same rule set as the sibling lab repos (~/.claude/quality/STYLE.md §1). RUF001-003
# are ignored because OR notation and railway text carry intentional Unicode.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["genstudy"]
